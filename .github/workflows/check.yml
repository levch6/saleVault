name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (a tag can be moved); Dependabot bumps the SHA and the
# version comment together.
jobs:
  check:
    name: lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.45.0

      - name: Install dependencies
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && pnpm install --frozen-lockfile)

      # Offline only: live tests are deselected and no Playwright browser is needed.
      - name: Lint, type check and test
        run: just check

      - name: Build the UI
        run: just build

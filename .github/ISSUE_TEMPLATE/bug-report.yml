name: Bug report
description: Something does not work as the documentation describes.
labels: ["bug"]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you did
      description: The command you ran or the steps in the app.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The run summary or the log from data/logs/. Remove anything personal.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS (for example WSL2 Ubuntu on Windows 11) and the commit or version.

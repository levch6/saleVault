[project]
name = "salevault"
version = "0.1.0"
description = "Scrapes sale sections of fashion shops and serves them sorted by discount"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.9",
    "tenacity>=9.2.1",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
salevault = "salevault.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: hits real shop sites; run manually with `pytest -m live`"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
